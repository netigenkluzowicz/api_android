apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'maven-publish'


afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
            }
        }
    }
}

android {
    namespace "pl.netigen.coreapi"

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 35
        compileSdk 35
        aarMetadata {
            minCompileSdk = 32
        }

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {

    api Libraries.kotlinStdlib

    api Libraries.roomRuntime
    api Libraries.roomKTX
    kapt Libraries.roomCompiler

    api Libraries.viewModelKTX

    api Libraries.constraintLayout


    api Libraries.material

    api Libraries.appcompat

    api Libraries.coreKTX
    api Libraries.liveDataKTX
    api Libraries.runtimeKTX
    api Libraries.kotlinStdlib

    api Libraries.okhttp

    api Libraries.navigationFragment
    api Libraries.navigationUi
    api Libraries.navigationFragmentKTX
    api Libraries.navigationUiKTX
    api Libraries.coroutines

    api Libraries.gson

    api Libraries.glide
    kapt Libraries.glideCompiler
    api Libraries.timber

    api Libraries.playReview
    api Libraries.playReviewKtx
    api Libraries.playAppUpdate
    api Libraries.playAppUpdateKtx
}

