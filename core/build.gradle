apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'maven-publish'


afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
            }
        }
    }
}


android {
    namespace "pl.netigen.core"

    compileSdk 35

    defaultConfig {
        minSdk 23
        targetSdk 35
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures { viewBinding true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    // TODO: Re-enable 'NullSafeMutableLiveData'.
    // Context: AGP 8.7.3 + Kotlin 1.9.24 causes a crash in
    // androidx.lifecycle.lint.NonNullableMutableLiveDataDetector
    // ("Found class ... KaCallableMemberCall, but interface was expected")
    // when running lintVital. Remove this disable in all modules after migrating to
    // Kotlin 2.0.x (with Compose Compiler 1.6.x) or once AndroidX ships a fix.
    lint {
        disable "NullSafeMutableLiveData"
    }
}


dependencies {
    implementation project(path: ':core-api')

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:1.9.24'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'io.mockk:mockk:1.13.12'
    testImplementation 'org.robolectric:robolectric:4.15.1'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'com.jraska.livedata:testing-ktx:1.2.0'

    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'androidx.test:runner:1.7.0'
    testImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    androidTestImplementation 'org.jetbrains.kotlin:kotlin-test-junit:1.9.24'
    androidTestImplementation 'io.mockk:mockk-android:1.13.12'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}